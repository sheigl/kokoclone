[project]
name = "kokoclone"
version = "0.1.0"
description = "KokoClone is a multilingual voice cloning system with RVC v2 quality. Built on Kokoro-ONNX for TTS and RVC v2 for high-fidelity voice conversion."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "faiss-cpu>=1.7.0",
    "gradio>=6.8.0",

    "misaki[en,ja,zh]>=0.9.4",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "pyworld>=0.3.4",
    "scipy>=1.11.0",
    "soundfile>=0.13.1",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "tqdm>=4.65.0",
    "uvicorn>=0.30.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
cpu = []
gpu = []
xpu = [
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
]
train = ["kokoclone-train"]
test = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
kokoclone-train = { path = "../kokoclone-train" }
torch = [
    { index = "pytorch-xpu", extra = "xpu" },
]
torchaudio = [
    { index = "pytorch-xpu", extra = "xpu" },
]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[tool.uv]
no-build-isolation-package = ["flash-attn"]
conflicts = [
    [
        { extra = "gpu" },
        { extra = "xpu" },
    ],
]

[tool.setuptools.packages.find]
include = ["core", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
